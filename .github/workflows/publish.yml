name: Publish to VS Code Marketplace and Open VSX

on:
  release:
    types: [published]

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run tests
        run: |
          npm run compile
          npx tsc --project tsconfig.test.json
          npx vitest run
          xvfb-run -a node test/runTests.js

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: npx --yes ovsx publish --skip-duplicate --trusted-publishing
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
