name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4

      - run: bun install --frozen-lockfile

      - name: Build extension and Zed LSP server
        run: |
          bun run compile
          bun run build:zed
          git diff --exit-code zed/server/server.cjs

      - name: Unit tests
        run: bunx vitest run

      - name: Integration tests
        run: |
          bunx tsc --project tsconfig.test.json
          xvfb-run -a node test/runTests.js
